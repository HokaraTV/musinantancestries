<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Espèces jouables</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <main class="page" id="view"></main>
    <script src="data/elven_ancestry.js"></script>
    <script src="data/elven_dons.js"></script>
    <script src="data/elven_heritages.js"></script>
    <script src="data/nain_ancestry.js"></script>
    <script src="data/nain_dons.js"></script>
    <script src="data/nain_heritages.js"></script>
    <script src="data/page.js"></script>
    <script>
      ELVÉN.heritages = ELVÉN_HERITAGES;
      ELVÉN.dons = ELVÉN_DONS;
    </script>
    <script>
      NAIN.heritages = NAIN_HERITAGES;
      NAIN.dons = NAIN_DONS;
    </script>
    <script>
      /* ===== MODIFIE ICI : une entrée par espèce =====
   nom, image (chemin ou lien, ex. "images/elfe.jpg"), accroche, resume (texte de la carte),
   description (paragraphes), tags (traits PF2e), pv, taille, vitesse, bonus, defauts, vision,
   langues, languesSup, infos (lignes supplémentaires [libellé, valeur]),
   capacites / heritages (titre + texte), dons (niveau + titre + texte).
   Un champ laissé vide n’est pas affiché. */

      const ESPECES = [
        ELVÉN,
        NAIN,
        ...[3, 4, 5, 6, 7, 8, 9].map((n) => ({
          nom: "Espèce " + n,
          image: "",
          accroche: "Une courte phrase d’ambiance",
          resume: "Résumé en une ou deux lignes.",
          description: [
            "Premier paragraphe de description : apparence, culture, place dans le monde.",
            "Deuxième paragraphe si besoin.",
          ],
          tags: ["Humanoïde"],
          pv: "8",
          taille: "M",
          vitesse: "7,5 m",
          bonus: "Libre, Libre",
          defauts: "Aucun",
          vision: "Normale",
          langues: "Commun",
          languesSup: "Selon l’Intelligence",
          infos: [],
          capacites: [
            {
              titre: "Capacité spéciale",
              texte: "Description de la capacité.",
            },
          ],
          heritages: [
            { titre: "Héritage 1", texte: "Description de l’héritage." },
            { titre: "Héritage 2", texte: "Description de l’héritage." },
          ],
          dons: [
            {
              niveau: 1,
              titre: "Don d’ascendance",
              texte: "Description du don.",
            },
            {
              niveau: 5,
              titre: "Don d’ascendance",
              texte: "Description du don.",
            },
          ],
        })),
      ];
      /* ===== FIN DE LA ZONE À MODIFIER ===== */

      // Zone de la page où tout le contenu est écrit (<div id="view"> dans index.html)
      const view = document.getElementById("view");

      // esc : protège un texte pour l'insérer dans un attribut HTML (src, alt…)
      // en remplaçant & < > " par leurs versions sûres.
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      // html : laisse le texte tel quel, donc les balises que tu écris dans tes
      // données (<b>, <i>, <a>…) fonctionnent. À réserver à du contenu de confiance.
      const html = (s) =>
        String(
          s,
        ); /* contenu : le HTML (<b>, <i>, <a>…) est conservé tel quel */

      // txt : enlève toutes les balises pour obtenir du texte simple
      // (utilisé pour le titre de l'onglet du navigateur, les adresses, la recherche).
      const txt = (s) =>
        String(s).replace(
          /<[^>]*>/g,
          "",
        ); /* texte sans balises (titre de l’onglet, adresses, recherche) */

      // slug : transforme un nom en morceau d'adresse propre.
      // "Clan’s Edge" devient "clan-s-edge" (minuscules, sans accents, tirets).
      const slug = (n) =>
        txt(n)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");

      // hue : donne une teinte (0 à 360) différente à chaque espèce d'après sa position.
      // Sert de fond coloré quand l'espèce n'a pas d'image.
      const hue = (i) => (i * 40 + 200) % 360;

      // portrait : bloc image d'une espèce (carte d'accueil et infobox de la fiche).
      // Avec une image : balise <img>. Sans image : le numéro de l'espèce sur fond coloré.
      const portrait = (e, i) =>
        `<div class="card-img" style="--h:${hue(i)}">${e.image ? `<img src="${esc(e.image)}" alt="${esc(txt(e.nom))}" loading="lazy">` : `<span>${i + 1}</span>`}</div>`;

      // section : affiche un titre <h3> puis une liste de paragraphes "Titre. Texte".
      // Utilisé pour les "Capacités spéciales". Si la liste est vide, ne renvoie rien.
      const section = (t, a) =>
        a && a.length
          ? `<h3>${t}</h3>` +
            a
              .map(
                (x) =>
                  `<p><strong>${html(x.titre)}.</strong> ${html(x.texte)}</p>`,
              )
              .join("")
          : "";

      // liste : renvoie la liste à afficher selon son type.
      //   "don"      → les dons de l'espèce, triés par niveau croissant
      //   "heritage" → les héritages tels quels
      //   autre      → liste vide
      const liste = (e, k) =>
        k === "don"
          ? [...(e.dons || [])].sort((x, y) => x.niveau - y.niveau)
          : k === "heritage"
            ? e.heritages || []
            : [];

      // lien : lien cliquable vers la page de détail d'un don.
      // Ajoute les pastilles "Legacy" et "Uncommon" si le don en a besoin.
      const lien = (e, k, x) =>
        `<a class="d-btn d-link" href="#/${slug(e.nom)}/${k}/${slug(x.titre)}"><span>${html(x.titre)}${x.legacy ? ` <em class="legacy">Legacy</em>` : ""}${(x.traits || []).includes("Uncommon") ? ` <em class="legacy">Uncommon</em>` : ""}</span><i aria-hidden="true"></i></a>`;

      /* ---------- 2. Onglet "Héritages" ---------- */

      // sousSections : tableau à deux colonnes (Héritage | Description).
      // Chaque héritage donne une ligne : nom, pastille Legacy, source, puis les
      // paragraphes du texte. [].concat(x.texte) accepte une chaîne OU un tableau.
      // Sans héritage, renvoie "" (la fiche affiche alors "Aucun héritage renseigné.").
      const sousSections = (e) =>
        e.heritages && e.heritages.length
          ? `<div class="tablewrap"><table class="dons herit"><thead><tr><th>Héritage</th><th>Description</th></tr></thead><tbody>` +
            liste(e, "heritage")
              .map(
                (x) =>
                  `<tr><th scope="row" class="d-name">${html(x.titre)}${x.legacy ? ` <em class="legacy">Legacy</em>` : ""}${x.source ? `<span class="h-src">${html(x.source)}</span>` : ""}</th><td class="h-txt">${[]
                    .concat(x.texte)
                    .map((t) => `<p>${html(t)}</p>`)
                    .join("")}</td></tr>`,
              )
              .join("") +
            `</tbody></table></div>`
          : "";

      /* ---------- 3. Onglet "Dons" : tableaux et filtres ---------- */

      // norm : texte simplifié pour comparer et chercher (sans balises, minuscules,
      // sans accents). "Écho" et "echo" deviennent identiques.
      const norm = (t) =>
        txt(t)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");

      // livre : nom du livre sans le numéro de page.
      // "Player Core pg. 43" devient "Player Core".
      const livre = (t) =>
        String(t || "")
          .replace(/\s+pg\..*$/, "")
          .trim();

      // F : état des filtres, mémorisé tant que la page est ouverte.
      //   q = texte recherché | r = rareté | s = livre | p = "sans prérequis" coché
      const F = { q: "", r: "", s: "", p: false };

      // ligneDon : une ligne du tableau des dons (nom cliquable, prérequis, source).
      // Les attributs data-… stockent des valeurs prêtes à comparer pour filtrer.
      const ligneDon = (e, x) =>
        `<tr class="d-row" data-n="${esc(norm(x.titre))}" data-r="${(x.traits || []).includes("Uncommon") ? "uncommon" : "common"}" data-s="${esc(norm(livre(x.source)))}" data-p="${x.prereq ? 1 : 0}"><th scope="row" class="d-name">${lien(e, "don", x)}</th><td class="d-pre">${html(x.prereq || "—")}</td><td class="d-src">${html(livre(x.source))}</td></tr>`;

      // feats : construit tout l'onglet Dons.
      //   1. la barre de filtres (recherche, rareté, livre, sans prérequis)
      //   2. la barre de boutons (réinitialiser, tout déplier, tout replier)
      //   3. un bloc repliable <details> par niveau, contenant son tableau
      //   4. un message "Aucun don…" masqué tant qu'il reste des résultats
      const feats = (e) => {
        if (!(e.dons && e.dons.length)) return "";
        const L = liste(e, "don"),
          // livres : liste des livres sources sans doublon, triée (pour le menu déroulant)
          livres = [
            ...new Set(L.map((x) => livre(x.source)).filter(Boolean)),
          ].sort(),
          // niveaux : liste des niveaux présents, sans doublon
          niveaux = [...new Set(L.map((x) => x.niveau))];
        return (
          `<div class="filtres" role="search"><input type="search" id="f-q" placeholder="Rechercher un don…" aria-label="Rechercher un don" autocomplete="off"><select id="f-rare" aria-label="Rareté"><option value="">Toutes raretés</option><option value="common">Common</option><option value="uncommon">Uncommon</option></select><select id="f-src" aria-label="Livre source"><option value="">Tous les livres</option>${livres.map((l) => `<option value="${esc(norm(l))}">${html(l)}</option>`).join("")}</select><label class="f-chk"><input type="checkbox" id="f-pre"> Sans prérequis</label></div>
  <div class="f-bar"><p class="f-count" id="f-count" aria-live="polite"></p><div><button type="button" class="f-btn" id="f-reset">Réinitialiser</button><button type="button" class="f-btn" data-fold="open">Tout déplier</button><button type="button" class="f-btn" data-fold="close">Tout replier</button></div></div>` +
          niveaux
            .map((n) => {
              const g = L.filter((x) => x.niveau === n);
              return `<details class="grp" open><summary><span class="lvl">${html(n)}</span>Niveau ${html(n)}<span class="g-count">${g.length}</span></summary><div class="tablewrap"><table class="dons"><thead><tr><th>Don</th><th>Prérequis</th><th>Source</th></tr></thead><tbody>${g.map((x) => ligneDon(e, x)).join("")}</tbody></table></div></details>`;
            })
            .join("") +
          `<p class="f-none" id="f-none" hidden>Aucun don ne correspond à ces filtres.</p>`
        );
      };

      // filtrer : applique les filtres F à toutes les lignes de dons.
      // Une ligne reste visible si elle respecte TOUS les filtres actifs.
      // Met aussi à jour : le compteur de chaque niveau, le groupe masqué s'il est
      // vide, le compteur total ("12 / 35 dons") et le message "Aucun don…".
      function filtrer() {
        const q = norm(F.q).trim();
        let tot = 0,
          vis = 0;
        view.querySelectorAll(".grp").forEach((g) => {
          let n = 0;
          g.querySelectorAll(".d-row").forEach((r) => {
            tot++;
            const d = r.dataset,
              ok =
                (!q || d.n.includes(q)) &&
                (!F.r || d.r === F.r) &&
                (!F.s || d.s === F.s) &&
                (!F.p || d.p === "0");
            r.hidden = !ok;
            if (ok) n++;
          });
          g.hidden = n === 0;
          vis += n;
          const c = g.querySelector(".g-count");
          if (c) c.textContent = n;
        });
        const c = document.getElementById("f-count");
        if (c)
          c.textContent =
            vis === tot ? tot + " dons" : vis + " / " + tot + " dons";
        const z = document.getElementById("f-none");
        if (z) z.hidden = vis > 0;
      }

      // initFiltres : remet dans les champs les valeurs mémorisées dans F
      // (utile quand on revient sur l'onglet), puis lance un premier filtrage.
      function initFiltres() {
        const set = (id, k, v) => {
          const el = document.getElementById(id);
          if (el) el[k] = v;
        };
        set("f-q", "value", F.q);
        set("f-rare", "value", F.r);
        set("f-src", "value", F.s);
        set("f-pre", "checked", F.p);
        filtrer();
      }

      // Écouteurs des filtres. Ils sont posés une seule fois sur #view (et non sur
      // chaque champ), car les champs sont recréés à chaque changement de page.
      // Frappe dans la recherche : on met à jour F.q et on filtre.
      view.addEventListener("input", (e) => {
        if (e.target.id === "f-q") {
          F.q = e.target.value;
          filtrer();
        }
      });
      // Changement d'un menu ou de la case : on met à jour la bonne valeur de F.
      // Si l'élément n'est aucun des trois (return), on ne filtre pas pour rien.
      view.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "f-rare") F.r = t.value;
        else if (t.id === "f-src") F.s = t.value;
        else if (t.id === "f-pre") F.p = t.checked;
        else return;
        filtrer();
      });
      // Boutons : "Réinitialiser" vide tous les filtres ; "Tout déplier / replier"
      // ouvre ou ferme tous les blocs de niveaux.
      view.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.id === "f-reset") {
          Object.assign(F, { q: "", r: "", s: "", p: false });
          initFiltres();
        } else if (b.dataset.fold)
          view
            .querySelectorAll(".grp")
            .forEach((g) => (g.open = b.dataset.fold === "open"));
      });

      /* ---------- 4. Les pages ---------- */

      // STATS : champs de l'espèce affichés dans l'infobox, avec leur libellé.
      // Format : [nom du champ dans les données, texte affiché]. Les champs vides
      // sont ignorés automatiquement. Pour ajouter une ligne, ajoute une paire ici.
      const STATS = [
        ["pv", "Points de vie"],
        ["taille", "Taille"],
        ["vitesse", "Vitesse"],
        ["bonus", "Bonus de carac."],
        ["defauts", "Défaut de carac."],
        ["vision", "Vision"],
        ["langues", "Langues"],
      ];

      // accueil : page d'accueil. Titre, introduction, puis une carte par espèce
      // (image, nom, résumé) qui mène vers la fiche.
      function accueil() {
        document.title = txt(TITRE);
        view.className = "page";
        view.innerHTML = `<header class="pagehead"><h1>${html(TITRE)}</h1><p class="tagline">${html(INTRO)}</p></header>
  <div class="grid">${ESPECES.map((e, i) => `<a class="card" href="#/${slug(e.nom)}">${portrait(e, i)}<div class="card-body"><h3>${html(e.nom)}</h3><p>${html(e.resume)}</p></div></a>`).join("")}</div>`;
      }

      // ONGLETS : les trois onglets de la fiche [clé utilisée dans l'adresse, libellé].
      const ONGLETS = [
        ["presentation", "Présentation"],
        ["heritages", "Héritages"],
        ["dons", "Dons"],
      ];

      // descr : un élément de la description d'une espèce. Deux formes possibles :
      //   - une simple chaîne  → un paragraphe
      //   - { titre, texte }   → un sous-titre <h3> suivi de ses paragraphes
      const descr = (t) =>
        typeof t === "string"
          ? `<p>${html(t)}</p>`
          : `<h3>${html(t.titre)}</h3>${[]
              .concat(t.texte)
              .map((p) => `<p>${html(p)}</p>`)
              .join("")}`;

      // fiche : page d'une espèce. i = position de l'espèce, tab = onglet affiché.
      function fiche(i, tab = "presentation") {
        // e = espèce courante, p = précédente, n = suivante (on boucle aux extrémités)
        const e = ESPECES[i],
          p = ESPECES[(i + ESPECES.length - 1) % ESPECES.length],
          n = ESPECES[(i + 1) % ESPECES.length];
        // rows : lignes de l'infobox = les STATS remplies + les "infos" libres de
        // l'espèce. Les lignes sans valeur sont retirées.
        const rows = [
          ...STATS.map(([k, l]) => [l, e[k]]),
          ...(e.infos || []),
        ].filter(([, v]) => v);
        // panneaux : contenu de chaque onglet, calculé seulement quand on l'ouvre.
        // C'est ici que les messages "Aucun … renseigné" s'affichent si c'est vide.
        const panneaux = {
          presentation: () =>
            (e.description || []).map(descr).join("") +
            section("Capacités spéciales", e.capacites),
          heritages: () =>
            sousSections(e) || "<p>Aucun héritage renseigné.</p>",
          dons: () => feats(e) || "<p>Aucun don renseigné.</p>",
        };
        // nb : nombres affichés dans les pastilles des onglets
        const nb = {
          heritages: (e.heritages || []).length,
          dons: (e.dons || []).length,
        };
        document.title = txt(e.nom + " – " + TITRE);
        view.className = "page wide";
        // Structure : fil d'Ariane, en-tête (nom, accroche, tags), onglets, contenu
        // de l'onglet actif, infobox à droite, puis liens vers espèces voisines.
        view.innerHTML = `<div class="crumbs"><a href="#/">Accueil</a><span>›</span><span>${html(e.nom)}</span></div>
  <div class="entry-grid"><div class="col"><div class="ph"><p class="eyebrow">Espèce</p><h1>${html(e.nom)}</h1><p class="lede">${html(e.accroche)}</p><div class="tags">${(e.tags || []).map((t) => `<span class="tag">${html(t)}</span>`).join("")}</div></div>
  <div class="body"><nav class="tabs" aria-label="Sections de la fiche">${ONGLETS.map(([k, l]) => `<a href="#/${slug(e.nom)}${k === "presentation" ? "" : "/" + k}"${k === tab ? ' aria-current="page"' : ""}>${l}${nb[k] ? `<small>${nb[k]}</small>` : ""}</a>`).join("")}</nav>
  <div class="prose">${panneaux[tab]()}</div></div></div>
  <aside class="infobox">${portrait(e, i)}<div class="ib-head"><span>Espèce</span><strong>${html(e.nom)}</strong></div><dl>${rows.map(([k, v]) => `<dt>${html(k)}</dt><dd>${html(v)}</dd>`).join("")}</dl></aside></div>
  <div class="refs"><a class="chip" href="#/${slug(p.nom)}"><small>Précédente</small>${html(p.nom)}</a><a class="chip" href="#/${slug(n.nom)}"><small>Suivante</small>${html(n.nom)}</a></div>`;
        // Les filtres n'existent que sur l'onglet Dons : on les initialise là seulement.
        if (tab === "dons") initFiltres();
      }

      // detail : page d'un don ou d'un héritage.
      //   i = espèce, k = "don" ou "heritage", j = position dans la liste.
      function detail(i, k, j) {
        // e = espèce, L = liste concernée, x = élément affiché,
        // p / n = précédent / suivant dans la liste (on boucle aux extrémités)
        const e = ESPECES[i],
          L = liste(e, k),
          x = L[j],
          p = L[(j + L.length - 1) % L.length],
          n = L[(j + 1) % L.length];
        // label : petit texte au-dessus du titre ; u : adresse de la page d'un élément
        const label = k === "don" ? "Don d’ascendance" : "Héritage",
          u = (y) => `#/${slug(e.nom)}/${k}/${slug(y.titre)}`;
        document.title = txt(x.titre + " – " + e.nom + " – " + TITRE);
        view.className = "page";
        // Les tags regroupent : niveau (dons), action, traits et "Legacy Content".
        // Le bloc .prose affiche dans l'ordre : prérequis, champs "meta" (Frequency,
        // Trigger…) avec leur libellé en gras, texte, puis la source en italique.
        view.innerHTML = `<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/${slug(e.nom)}">${html(e.nom)}</a><span>›</span><span>${html(x.titre)}</span></div>
  <div class="ph"><p class="eyebrow">${label} · ${html(e.nom)}</p><h1>${html(x.titre)}</h1>${((tg) => (tg.length ? `<div class="tags">${tg.map((t) => `<span class="tag">${html(t)}</span>`).join("")}</div>` : ""))([...(k === "don" ? ["Niveau " + x.niveau] : []), ...(x.action ? [x.action] : []), ...(x.traits || []), ...(x.legacy ? ["Legacy Content"] : [])])}</div>
  <div class="prose">${x.prereq ? `<p><strong>Prerequisites</strong> ${html(x.prereq)}</p>` : ""}${(x.meta || []).map(([a, b]) => `<p><strong>${html(a)}</strong> : ${html(b)}</p>`).join("")}${[]
    .concat(x.texte)
    .map((t) => `<p>${html(t)}</p>`)
    .join(
      "",
    )}${x.source ? `<p><em>Source: ${html(x.source)}</em></p>` : ""}</div>
  <div class="refs"><a class="chip" href="#/${slug(e.nom)}/${k === "don" ? "dons" : "heritages"}"><small>Retour</small>${k === "don" ? "Dons" : "Héritages"} · ${html(e.nom)}</a>${L.length > 1 ? `<a class="chip" href="${u(p)}"><small>Précédent</small>${html(p.titre)}</a><a class="chip" href="${u(n)}"><small>Suivant</small>${html(n.titre)}</a>` : ""}</div>`;
      }

      /* ---------- 5. Navigation ---------- */

      // route : lit l'adresse (la partie après #) et affiche la bonne page.
      // Exemple : "#/nain/don/clan-lore" donne q = ["nain", "don", "clan-lore"].
      //   q[0] = espèce | q[1] = onglet ou type | q[2] = élément
      function route() {
        const q = location.hash
          .replace(/^#\/?/, "")
          .split("/")
          .map(decodeURIComponent);
        // i : position de l'espèce dont le slug correspond (-1 si introuvable)
        const i = ESPECES.findIndex((e) => slug(e.nom) === q[0]);
        // j : position de l'élément demandé dans la liste (-1 si aucun)
        const j =
          i >= 0
            ? liste(ESPECES[i], q[1]).findIndex((x) => slug(x.titre) === q[2])
            : -1;
        // Choix de la page : élément trouvé → détail ; espèce trouvée → fiche
        // (onglet inconnu = Présentation) ; sinon → accueil.
        j >= 0
          ? detail(i, q[1], j)
          : i >= 0
            ? fiche(
                i,
                ["heritages", "dons"].includes(q[1]) ? q[1] : "presentation",
              )
            : accueil();
        // Remonte en haut de page à chaque changement de page.
        scrollTo(0, 0);
      }

      // Clic sur n'importe où d'une ligne du tableau : ouvre le lien du don
      // (sauf si on a cliqué directement sur un lien, déjà géré par le navigateur).
      view.addEventListener("click", (e) => {
        const r = e.target.closest(".d-row");
        if (!r || e.target.closest("a")) return;
        const a = r.querySelector("a");
        if (a) a.click();
      });
      // Quand l'adresse change (clic sur un lien, bouton Précédent…), on réaffiche.
      addEventListener("hashchange", route);
      // Premier affichage au chargement de la page.
      route();

      /* ---------- 6. Décor : ciel étoilé animé ---------- */
      // Dessine des étoiles scintillantes et quelques étoiles filantes sur le
      // <canvas id="sky"> en arrière-plan. Purement décoratif : si tu le supprimes,
      // le reste du site fonctionne pareil. La fonction est lancée immédiatement
      // "(() => { ... })();" pour ne pas laisser de variables en dehors.
      (() => {
        const c = document.getElementById("sky"),
          x = c.getContext("2d"),
          // RM : vrai si l'utilisateur a demandé moins d'animations dans son système
          RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let W, // largeur de la fenêtre
          H, // hauteur de la fenêtre
          stars = [], // étoiles fixes
          shots = [], // étoiles filantes en cours
          last = 0, // heure de l'image précédente
          next = 0, // heure de la prochaine étoile filante
          raf = 0; // identifiant de l'animation, pour pouvoir l'arrêter

        // build : prépare le canvas à la taille de la fenêtre et crée les étoiles.
        // Le nombre d'étoiles dépend de la surface (max 900). Environ 6 % sont
        // "brillantes" (plus grosses). La résolution est doublée au maximum pour
        // rester nette sur les écrans haute densité.
        function build() {
          const d = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          c.width = W * d;
          c.height = H * d;
          x.setTransform(d, 0, 0, d, 0, 0);
          stars = Array.from(
            { length: Math.min(900, Math.round((W * H) / 7500)) },
            () => {
              const b = Math.random() < 0.06;
              return {
                x: Math.random() * W,
                y: Math.random() * H,
                r: b ? 1.5 + Math.random() * 0.8 : 0.35 + Math.random() * 0.75,
                a: 0.3 + Math.random() * 0.6,
                ph: Math.random() * 6.28,
                sp: 0.5 + Math.random() * 1.5,
                b,
              };
            },
          );
          draw(0, 0);
        }

        // draw : dessine une image complète. t = temps écoulé, dt = durée depuis
        // l'image précédente. Ordre : effacer, halo violet/bleu en fond, étoiles
        // (leur éclat varie avec le temps pour scintiller), puis étoiles filantes.
        function draw(t, dt) {
          x.clearRect(0, 0, W, H);
          const g = x.createRadialGradient(
            W * 0.55,
            H * 0.32,
            0,
            W * 0.55,
            H * 0.32,
            Math.max(W, H) * 0.65,
          );
          g.addColorStop(0, "rgba(72,52,130,.17)");
          g.addColorStop(0.5, "rgba(24,40,90,.07)");
          g.addColorStop(1, "rgba(5,8,19,0)");
          x.globalAlpha = 1;
          x.fillStyle = g;
          x.fillRect(0, 0, W, H);
          for (const s of stars) {
            // tw : facteur de scintillement (fixe à 1 si animations réduites)
            const tw = RM
              ? 1
              : 0.62 + 0.38 * Math.sin((t / 1000) * s.sp + s.ph);
            x.globalAlpha = Math.min(1, s.a * tw);
            x.fillStyle = s.b ? "#fff" : "#d9e6ff";
            x.beginPath();
            x.arc(s.x, s.y, s.r, 0, 6.2832);
            x.fill();
          }
          x.globalAlpha = 1;
          // Étoiles filantes : on avance chacune, on la supprime quand sa durée de
          // vie est finie, sinon on trace sa traînée (dégradé transparent → blanc).
          for (let k = shots.length - 1; k >= 0; k--) {
            const o = shots[k];
            o.age += dt;
            if (o.age > o.life) {
              shots.splice(k, 1);
              continue;
            }
            const hx = o.x + o.vx * o.age,
              hy = o.y + o.vy * o.age,
              sp = Math.hypot(o.vx, o.vy),
              tx = hx - (o.vx / sp) * o.len,
              ty = hy - (o.vy / sp) * o.len;
            const lg = x.createLinearGradient(tx, ty, hx, hy);
            lg.addColorStop(0, "rgba(255,255,255,0)");
            lg.addColorStop(1, "#fff");
            x.globalAlpha = Math.sin((Math.PI * o.age) / o.life);
            x.strokeStyle = lg;
            x.lineWidth = 1.5;
            x.beginPath();
            x.moveTo(tx, ty);
            x.lineTo(hx, hy);
            x.stroke();
          }
          x.globalAlpha = 1;
        }

        // loop : boucle d'animation, appelée à chaque image par le navigateur.
        // Quand l'heure "next" est dépassée, lance une nouvelle étoile filante
        // (angle, vitesse, position et durée au hasard) et programme la suivante
        // dans 3,5 à 9 secondes.
        function loop(t) {
          const dt = Math.min(0.05, (t - last) / 1000 || 0);
          last = t;
          if (t > next) {
            const a = ((28 + Math.random() * 14) * Math.PI) / 180,
              sp = 650 + Math.random() * 350;
            shots.push({
              x: Math.random() * W * 0.8,
              y: Math.random() * H * 0.45,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp,
              age: 0,
              life: 0.8 + Math.random() * 0.6,
              len: 110 + Math.random() * 90,
            });
            next = t + 3500 + Math.random() * 5500;
          }
          draw(t, dt);
          raf = requestAnimationFrame(loop);
        }

        build();
        // go : démarre l'animation (première étoile filante après 1,5 s)
        const go = () => {
          raf = requestAnimationFrame((t) => {
            last = t;
            next = t + 1500;
            loop(t);
          });
        };
        // Si les animations ne sont pas réduites : on lance, et on met l'animation
        // en pause quand l'onglet est caché (pour économiser la batterie).
        // Sinon, le ciel reste une image fixe.
        if (!RM) {
          go();
          document.addEventListener("visibilitychange", () => {
            cancelAnimationFrame(raf);
            if (!document.hidden) go();
          });
        }
        // Au redimensionnement, on reconstruit le ciel (après 200 ms de calme),
        // mais seulement si la taille a vraiment changé : cela évite de le refaire
        // quand la barre d'adresse d'un téléphone apparaît ou disparaît.
        let rt;
        addEventListener("resize", () => {
          clearTimeout(rt);
          rt = setTimeout(() => {
            if (Math.abs(innerWidth - W) > 40 || innerHeight - H > 150) build();
          }, 200);
        });
      })();
    </script>
  </body>
</html>
