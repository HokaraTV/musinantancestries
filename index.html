<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espèces jouables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#050813;--panel:#0c1424;--panel-2:#101b30;--line:#1b2943;--text:#e9eef7;--muted:#b3bed0;--accent:#86cdf5;
--accent-soft:color-mix(in srgb,var(--accent) 14%,var(--bg));--accent-line:color-mix(in srgb,var(--accent) 38%,var(--bg));
--f-display:'Cinzel Decorative','Cinzel',Georgia,serif;--f-head:'Cinzel',Georgia,serif;--f-prose:'Cormorant Garamond',Georgia,serif;--f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:1080px;margin:0 auto;min-height:100vh;padding:40px max(20px,env(safe-area-inset-right,0px)) 96px max(20px,env(safe-area-inset-left,0px))}
.page.wide{max-width:none;padding-inline:clamp(20px,4vw,64px)}
.tagline{margin:0;font-family:var(--f-prose);font-size:1.4rem;font-weight:500;line-height:1.4;color:#cdd6e5}
/* Accueil */
.pagehead{display:grid;justify-items:center;gap:8px;text-align:center;margin-bottom:40px}
.pagehead h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.5rem);line-height:1.1;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 0 24px rgba(160,200,255,.4);text-wrap:balance}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.card{flex:1 1 260px;max-width:320px;min-width:0;display:flex;flex-direction:column;text-align:center;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.card-img{width:100%;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 38% 26%),hsl(var(--h) 40% 10%))}
.card-img span{font-family:var(--f-display);font-size:4rem;color:rgba(255,255,255,.5)}
.card-img img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .card-img img{transform:scale(1.04)}
.card-body{display:grid;gap:6px;padding:16px 18px 20px}
.card h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:1.08rem;letter-spacing:.03em;color:#f1f5fc}
.card p{margin:0;font-family:var(--f-prose);font-weight:500;font-size:1.25rem;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Fiche */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:22px;font-size:13px;color:var(--muted)}
.crumbs a{color:var(--accent);text-decoration:none}.crumbs a:hover{text-decoration:underline}
.col{min-width:0}
.ph{margin-bottom:28px}
.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ph h1{margin:0;font-family:var(--f-head);font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.03em;line-height:1.15;overflow-wrap:anywhere}
.lede{margin:10px 0 0;font-family:var(--f-prose);font-style:italic;font-weight:500;font-size:1.45rem;color:#d0d9e8}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{padding:3px 10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-radius:4px}
.entry-grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,400px);gap:clamp(24px,4vw,56px);align-items:start}
.prose{min-width:0;font-family:var(--f-prose);font-size:1.45rem;font-weight:500;line-height:1.65;color:#f3f6fb;text-rendering:optimizeLegibility}
.prose p{margin:0 0 1em}
.prose h3{margin:1.8em 0 .5em;font-family:var(--f-head);font-weight:600;font-size:1.02rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.prose h3:first-child{margin-top:0}
.prose h4{margin:1.5em 0 .35em;font-family:var(--f-head);font-weight:600;font-size:1.15rem;letter-spacing:.03em;color:#f1f5fc}
.prose h3+h4,.prose h4+p{margin-top:0}
.prose h3+h4{margin-top:.6em}
.lvl{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font:600 11px/1.6 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);vertical-align:2px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.dons{width:100%;border-collapse:collapse;font-size:1.25rem;line-height:1.45}
.dons th,.dons td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.dons tbody tr:last-child>*{border-bottom:0}
.dons thead th{background:var(--panel-2);font:600 11px/1.4 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.dons .d-lvl{width:1%;white-space:nowrap}
.dons .d-lvl .lvl{margin:0}
.dons .d-name{font-family:var(--f-head);font-weight:600;font-size:1.1rem;letter-spacing:.02em;color:#f1f5fc}
.dons .d-row{cursor:pointer;transition:background .15s}
.dons .d-row:hover{background:var(--accent-soft)}
.d-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.d-btn i{flex:none;width:8px;height:8px;margin:-3px 4px 0 0;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.d-link{text-decoration:none}
.d-link i{margin-top:0;transform:rotate(-45deg);transition:transform .2s}
.dons .d-row:hover .d-link i{transform:translateX(3px) rotate(-45deg)}
.dons .d-desc td{background:var(--panel-2);color:#d6deec;padding-top:10px;padding-bottom:14px}
.body{min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 26px;border-bottom:1px solid var(--line)}
.tabs a{display:inline-flex;align-items:center;gap:8px;margin-bottom:-1px;padding:11px 16px;border-bottom:2px solid transparent;font:600 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .15s}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs small{padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font:600 10px/1.6 var(--f-ui);letter-spacing:.04em;color:var(--muted)}
.stats{display:grid;grid-template-columns:minmax(120px,28%) minmax(0,1fr);margin:0 0 1.2em;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.stats dt,.stats dd{margin:0;padding:11px 16px;border-bottom:1px solid var(--line)}
.stats dt{display:flex;align-items:center;background:var(--panel-2);font:600 11px/1.5 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats dd{font-family:var(--f-prose);font-weight:500;font-size:1.25rem;line-height:1.35;color:#f3f6fb}
.stats dt:nth-last-of-type(1),.stats dd:last-of-type{border-bottom:0}
@media (max-width:900px){.tabs{flex-wrap:nowrap;overflow-x:auto}}
.ib-caps{padding:14px 16px 16px;border-top:1px solid var(--line)}
.ib-caps h3{margin:0 0 8px;font:600 11px/1.5 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ib-caps p{margin:0 0 .7em;font-family:var(--f-prose);font-weight:500;font-size:1.2rem;line-height:1.4;color:#f3f6fb}
.ib-caps p:last-child{margin-bottom:0}
.legacy{margin-left:8px;padding:1px 7px;border:1px solid var(--line);border-radius:4px;font:600 10px/1.6 var(--f-ui);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filtres{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.filtres input[type=search],.filtres select{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--text);font:500 14px var(--f-ui)}
.filtres input[type=search]{flex:1 1 200px;min-width:0}
.filtres select{flex:0 1 170px;min-width:0}
.f-chk{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--f-ui);color:var(--text);cursor:pointer}
.f-chk input{width:16px;height:16px;accent-color:var(--accent)}
.f-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.f-bar div{display:flex;flex-wrap:wrap;gap:6px}
.prose .f-count{margin:0;font:500 13px var(--f-ui);color:var(--muted)}
.prose .f-none{font:500 14px var(--f-ui);color:var(--muted)}
.f-btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);font:600 12px var(--f-ui);cursor:pointer}
.f-btn:hover{color:var(--text);border-color:var(--accent-line)}
.grp{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.grp[hidden],.d-row[hidden]{display:none}
.grp summary{display:flex;align-items:center;gap:10px;padding:13px 16px;list-style:none;cursor:pointer;background:var(--panel-2);font:600 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.grp summary::-webkit-details-marker{display:none}
.grp summary::after{content:"";margin-left:auto;width:8px;height:8px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.grp[open] summary::after{transform:rotate(-135deg)}
.grp summary .lvl{margin:0}
.g-count{padding:1px 8px;border:1px solid var(--line);border-radius:10px;font:600 10px/1.6 var(--f-ui);letter-spacing:.04em;color:var(--muted)}
.grp .tablewrap{border:0;border-top:1px solid var(--line);border-radius:0;background:none}
.dons .d-pre,.dons .d-src{font-size:1.05rem;color:#c3cde0}
.dons .d-src{white-space:nowrap}
.herit tbody tr:nth-child(odd){background:color-mix(in srgb,var(--panel) 92%,transparent)}
.herit tbody tr:nth-child(even){background:color-mix(in srgb,var(--accent) 10%,var(--panel-2))}
.herit .d-name{width:24%;min-width:150px}
.h-src{display:block;margin-top:5px;font:500 11px/1.4 var(--f-ui);letter-spacing:.03em;color:var(--muted)}
.herit .h-txt{min-width:280px;font-size:1.15rem;line-height:1.5;color:#f3f6fb}
.herit .h-txt p{margin:0 0 .6em}
.herit .h-txt p:last-child{margin:0}
.infobox{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel) 90%,transparent)}
.ib-head{display:grid;gap:2px;padding:14px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ib-head span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ib-head strong{font-family:var(--f-head);font-size:1.1rem;font-weight:600;letter-spacing:.03em}
.infobox dl{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:10px 14px;margin:0;padding:16px}
.infobox dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.infobox dd{margin:0;font-family:var(--f-prose);font-weight:500;font-size:1.25rem;line-height:1.35;color:#f3f6fb}
.refs{margin-top:48px;display:flex;flex-wrap:wrap;gap:12px}
.chip{display:inline-flex;flex-direction:column;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;font-weight:500}
.chip:hover{border-color:var(--accent-line)}
.chip small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
@media (max-width:900px){.entry-grid{grid-template-columns:minmax(0,1fr) 230px;gap:22px}.infobox dl{grid-template-columns:minmax(0,1fr);gap:0;padding:12px 14px}.infobox dt{padding:8px 0 0}.infobox dd{padding-bottom:2px}.ib-head{padding:12px 14px}.page{padding-top:24px}}
@media (max-width:640px){.entry-grid{grid-template-columns:minmax(0,1fr);gap:24px}.col{display:contents}.infobox{order:1}.body{order:2}.infobox .card-img{aspect-ratio:16/7;max-height:200px}.infobox .card-img img{object-position:50% 25%}.infobox .card-img span{font-size:2.5rem}.infobox dl{grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:10px 14px;padding:16px}.infobox dt{padding-top:3px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="page" id="view"></main>

<script>
/* ===== MODIFIE ICI : une entrée par espèce =====
   nom, image (chemin ou lien, ex. "images/elfe.jpg"), accroche, resume (texte de la carte),
   description (paragraphes), tags (traits PF2e), pv, taille, vitesse, bonus, defauts, vision,
   langues, languesSup, infos (lignes supplémentaires [libellé, valeur]),
   capacites / heritages (titre + texte), dons (niveau + titre + texte).
   Un champ laissé vide n’est pas affiché. */
const TITRE="Espèces jouables";
const INTRO="Choisis l’espèce de ton personnage parmi les neuf peuples de la campagne.";
const NAIN={
  nom:"Nain",
  image:"images/Throren Stonehammer-Portrait.png",
  accroche:"Anciens maîtres de la magie, les nains ne jurent plus que par la force de leur bras.",
  resume:"Maîtres de la forge, les nains sont solides comme la pierre et ont une volonté d'acier .",
  description:[
    "Jamais vous ne croiserez d’êtres plus têtus que les seigneurs nains. Solides comme l’acier, les nains ont une volonté de fer et un sens aigu du devoir. Parfois méfiants envers les étrangers, les nains forgent des liens et des relations solides avec leur famille et leurs amis.",
    {titre:"Description physique",texte:"Les nains sont petits et trapus : ils mesurent trente centimètres de moins que la plupart des elvéns, avec un corps large et une carrure massive. Quel que soit leur genre, ils sont fiers de la longueur de leurs cheveux et de leur barbe qu’ils tressent en motifs complexes dont certains désignent un clan précis. Une longue barbe est signe de maturité et d’honneur dans de nombreux clans. Un nain atteint l’âge adulte vers 25 ans."},
    {titre:"Société",texte:"Autrefois, les nains vivaient sous la tyrannie des seigneurs elfiques. Obligés de se cacher dans les montagnes pour fuir les elfes, seigneurs des cieux, les nains devinrent les maîtres des arcanes et des runes. Pendant l’épidémie de l’Arcane, ils abandonnèrent la magie pour se concentrer sur l’artisanat. Maintenant, ils vivent dans des citadelles-montagnes disséminées à la surface, ce qui creuse de grands fossés culturels entre les clans. Presque tous partagent pourtant la passion de la pierre, du métal et de la famille. Rares sont ceux que l’on voit sans leur dague de clan à la ceinture, forgée juste avant leur naissance et propre à leur lignée."},
    {titre:"Croyances",texte:["Les nains tiennent à l’honneur et suivent de près les traditions de leur clan et de leur royaume. Ils ont un sens aigu de l’amitié et de la justice, mais choisissent leurs amis avec soin. Ils travaillent dur, mais savent toujours comment s'amuser, surtout si la bière coule à flots.","<b>Édits courants</b> : créer des objets utiles ; protéger sa communauté de ceux qui lui veulent du mal ; garder sa dague de clan près de soi.","<b>Anathèmes courants</b> : laisser une activité ou une promesse inachevée ; renier sa famille."]}
  ],
  tags:["Nain","Humanoïde"],
  pv:"10",
  taille:"Moyenne",
  vitesse:"20 pieds",
  bonus:"Constitution, Sagesse, Libre",
  defauts:"Charisme",
  vision:"Vision dans le noir",
  langues:"Commun, Nain",
  infos:[
    ["Espérance de vie","Environ 350 ans"]
  ],
  capacites:[
    {titre:"<b>Vision dans le noir</b>",texte:"Vous voyez dans l’obscurité et la pénombre aussi bien qu’en pleine lumière; votre vision est en noir et blanc."},
    {titre:"<b>Dague de clan</b>",texte:"Vous recevez une dague de clan, offerte à votre naissance. La vendre est un crime terrible qui attire le mépris des autres nains."}
  ],
  heritages:[
    {"titre": "Ancient-Blooded Dwarf", "source": "Player Core pg. 43", "texte": ["Dwarven heroes of old could shrug off their enemies’ magic, and some of that resistance manifests in you. You gain the Call on Ancient Blood reaction.", "Call on Ancient Blood (reaction). Trigger: You attempt a saving throw against a magical effect, but you haven’t rolled yet. Your ancestors’ innate resistance to magic surges, before slowly ebbing down. You gain a +1 circumstance bonus until the end of this turn. This bonus also applies to the triggering save.", "Feats requiring this heritage: Kneel for No God."]},
    {"titre": "Anvil Dwarf", "source": "Character Guide pg. 19", "legacy": true, "texte": "You are a descendant of a famed crafter and have your own amazing talent. Other dwarves might consider this a blessing from your ancestors or from the Forgefather himself, depending on where you grew up. You become trained in Crafting (or another skill if you were already trained in Crafting) and gain the Specialty Crafting skill feat, but you can pick two different specialties instead of one."},
    {"titre": "Death Warden Dwarf", "source": "Player Core pg. 43", "texte": ["Your ancestors were tomb guardians, and their power to ward off death passed on to you. If you roll a success on a saving throw against an effect that has the void trait or was created by an undead creature, you get a critical success instead.", "Feats requiring this heritage: Tomb-Watcher’s Glare."]},
    {"titre": "Elemental Heart Dwarf", "source": "Character Guide pg. 19", "legacy": true, "texte": ["Whether through a connection to Torag’s forge, the azers of the Plane of Fire, or another source, you can exude a burst of energy. Mbe’ke and Taralu dwarves of the Mwangi Expanse believe this heritage is a gift from dragons or elemental spirits. Choose one of the following damage types: acid, cold, electricity, or fire. Once chosen, this can’t be changed. You gain the Energy Emanation activity.", "Energy Emanation (two actions; Evocation, Primal; Frequency once per day). Energy bursts forth from your body. You deal 1d6 damage of your chosen type to all adjacent creatures (basic Reflex save using your class DC or spell DC, whichever is higher). At 3rd level, and every 2 levels thereafter, this damage increases by 1d6.", "Feats requiring this heritage: Energy Blessed."]},
    {"titre": "Forge Dwarf", "source": "Player Core pg. 43", "texte": "You have a remarkable adaptation to hot environments. This grants you fire resistance equal to half your level (minimum 1), and you treat environmental heat effects as if they were one step less extreme (incredible heat becomes extreme, extreme heat becomes severe, and so on)."},
    {"titre": "Forge-Blessed Dwarf", "source": "Highhelm pg. 109", "legacy": true, "texte": ["PFS Note: A Forge-Blessed dwarf can use their granted 1st-level spell once per scenario.", "You are from a family in Highhelm that venerates a particular dwarven deity above all others. Your birth was blessed by your family’s patron deity, granting you a fraction of their power. Choose one deity from the dwarven pantheon. You can cast the 1st-level spell they grant clerics (such as soothe if your family’s patron is Bolka) as an innate divine spell once per week."]},
    {"titre": "Oathkeeper Dwarf", "source": "Character Guide pg. 19", "legacy": true, "texte": "Growing up, you never tried to lie to get what you wanted, and even when necessary, lying makes you uncomfortable. The especially faithful might even have thought that you were blessed by the dwarven god of duty, Kols. You gain a +1 circumstance bonus to Perception checks to Sense Motive and to Perception DCs against attempts to Lie to you. Furthermore, you gain a +2 circumstance bonus to Diplomacy checks to convince others you speak the truth when you are telling the truth, and you take a –4 circumstance penalty to Lie and to your Deception DC against Sense Motive."},
    {"titre": "Rock Dwarf", "source": "Player Core pg. 43", "texte": "Your ancestors lived and worked among the ancient stones of the mountains or the depths of the earth. This makes you solid as a rock when you plant your feet. You gain a +2 circumstance bonus to your Fortitude or Reflex DC against attempts to Reposition, Shove, or Trip you. This bonus also applies to saving throws against spells or effects that attempt to force you to move or knock you prone. In addition, if any effect would force you to move 10 feet or more, you are moved only half the distance."},
    {"titre": "Strong-Blooded Dwarf", "source": "Player Core pg. 43", "texte": "Your blood runs hearty and strong, and you can shake off toxins. You gain poison resistance equal to half your level (minimum 1), and each of your successful saving throws against a poison affliction reduces its stage by 2, or by 1 for a virulent poison. Each critical success against an ongoing poison reduces its stage by 3, or by 2 for a virulent poison."}
  ],
  dons:[
    {"niveau": 1, "titre": "Avenge in Glory", "traits": ["Dwarf", "Uncommon"], "prereq": "", "source": "Character Guide pg. 20", "texte": ["You honor your ally’s life. You gain temporary Hit Points equal to your level for 1 minute. As long as you still have these temporary Hit Points, you also gain a +1 circumstance bonus to your attack and damage rolls."], "action": "Reaction", "meta": [["Frequency", "once per day"], ["Access", "mountain dwarf ethnicity"], ["Trigger", "An ally within 30 feet gains the dying condition."]], "detail": true},

const view=document.getElementById("view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s)
  .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/\*(.+?)\*/g,"<em>$1</em>");
const slug=n=>n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hue=i=>(i*40+200)%360;
const portrait=(e,i)=>`<div class="card-img" style="--h:${hue(i)}">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.nom)}" loading="lazy">`:`<span>${i+1}</span>`}</div>`;
const section=(t,a)=>a&&a.length?`<h3>${t}</h3>`+a.map(x=>`<p><strong>${esc(x.titre)}.</strong> ${esc(x.texte)}</p>`).join(""):"";
const liste=(e,k)=>k==="don"?[...(e.dons||[])].sort((x,y)=>x.niveau-y.niveau):k==="heritage"?(e.heritages||[]):[];
const lien=(e,k,x)=>`<a class="d-btn d-link" href="#/${slug(e.nom)}/${k}/${slug(x.titre)}"><span>${esc(x.titre)}${x.legacy?` <em class="legacy">Legacy</em>`:""}${(x.traits||[]).includes("Uncommon")?` <em class="legacy">Uncommon</em>`:""}</span><i aria-hidden="true"></i></a>`;
const sousSections=e=>e.heritages&&e.heritages.length?`<div class="tablewrap"><table class="dons herit"><thead><tr><th>Héritage</th><th>Description</th></tr></thead><tbody>`+liste(e,"heritage").map(x=>`<tr><th scope="row" class="d-name">${esc(x.titre)}${x.legacy?` <em class="legacy">Legacy</em>`:""}${x.source?`<span class="h-src">${esc(x.source)}</span>`:""}</th><td class="h-txt">${[].concat(x.texte).map(t=>`<p>${esc(t)}</p>`).join("")}</td></tr>`).join("")+`</tbody></table></div>`:"";
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const livre=t=>String(t||"").replace(/\s+pg\..*$/,"").trim();
const F={q:"",r:"",s:"",p:false};
const ligneDon=(e,x)=>`<tr class="d-row" data-n="${esc(norm(x.titre))}" data-r="${(x.traits||[]).includes("Uncommon")?"uncommon":"common"}" data-s="${esc(norm(livre(x.source)))}" data-p="${x.prereq?1:0}"><th scope="row" class="d-name">${lien(e,"don",x)}</th><td class="d-pre">${esc(x.prereq||"—")}</td><td class="d-src">${esc(livre(x.source))}</td></tr>`;
const feats=e=>{
  if(!(e.dons&&e.dons.length))return"";
  const L=liste(e,"don"),livres=[...new Set(L.map(x=>livre(x.source)).filter(Boolean))].sort(),niveaux=[...new Set(L.map(x=>x.niveau))];
  return `<div class="filtres" role="search"><input type="search" id="f-q" placeholder="Rechercher un don…" aria-label="Rechercher un don" autocomplete="off"><select id="f-rare" aria-label="Rareté"><option value="">Toutes raretés</option><option value="common">Common</option><option value="uncommon">Uncommon</option></select><select id="f-src" aria-label="Livre source"><option value="">Tous les livres</option>${livres.map(l=>`<option value="${esc(norm(l))}">${esc(l)}</option>`).join("")}</select><label class="f-chk"><input type="checkbox" id="f-pre"> Sans prérequis</label></div>
  <div class="f-bar"><p class="f-count" id="f-count" aria-live="polite"></p><div><button type="button" class="f-btn" id="f-reset">Réinitialiser</button><button type="button" class="f-btn" data-fold="open">Tout déplier</button><button type="button" class="f-btn" data-fold="close">Tout replier</button></div></div>`
  +niveaux.map(n=>{const g=L.filter(x=>x.niveau===n);return `<details class="grp" open><summary><span class="lvl">${esc(n)}</span>Niveau ${esc(n)}<span class="g-count">${g.length}</span></summary><div class="tablewrap"><table class="dons"><thead><tr><th>Don</th><th>Prérequis</th><th>Source</th></tr></thead><tbody>${g.map(x=>ligneDon(e,x)).join("")}</tbody></table></div></details>`}).join("")
  +`<p class="f-none" id="f-none" hidden>Aucun don ne correspond à ces filtres.</p>`;
};
function filtrer(){
  const q=norm(F.q).trim();let tot=0,vis=0;
  view.querySelectorAll(".grp").forEach(g=>{
    let n=0;
    g.querySelectorAll(".d-row").forEach(r=>{tot++;const d=r.dataset,ok=(!q||d.n.includes(q))&&(!F.r||d.r===F.r)&&(!F.s||d.s===F.s)&&(!F.p||d.p==="0");r.hidden=!ok;if(ok)n++});
    g.hidden=n===0;vis+=n;const c=g.querySelector(".g-count");if(c)c.textContent=n;
  });
  const c=document.getElementById("f-count");if(c)c.textContent=vis===tot?tot+" dons":vis+" / "+tot+" dons";
  const z=document.getElementById("f-none");if(z)z.hidden=vis>0;
}
function initFiltres(){
  const set=(id,k,v)=>{const el=document.getElementById(id);if(el)el[k]=v};
  set("f-q","value",F.q);set("f-rare","value",F.r);set("f-src","value",F.s);set("f-pre","checked",F.p);
  filtrer();
}
view.addEventListener("input",e=>{if(e.target.id==="f-q"){F.q=e.target.value;filtrer()}});
view.addEventListener("change",e=>{const t=e.target;if(t.id==="f-rare")F.r=t.value;else if(t.id==="f-src")F.s=t.value;else if(t.id==="f-pre")F.p=t.checked;else return;filtrer()});
view.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="f-reset"){Object.assign(F,{q:"",r:"",s:"",p:false});initFiltres()}
  else if(b.dataset.fold)view.querySelectorAll(".grp").forEach(g=>g.open=b.dataset.fold==="open");
});

  view.innerHTML=`<div class="crumbs"><a href="#/">Accueil</a><span>›</span><span>${esc(e.nom)}</span></div>
  <div class="entry-grid"><div class="col"><div class="ph"><p class="eyebrow">Espèce</p><h1>${esc(e.nom)}</h1><p class="lede">${esc(e.accroche)}</p><div class="tags">${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
  <div class="body"><nav class="tabs" aria-label="Sections de la fiche">${ONGLETS.map(([k,l])=>`<a href="#/${slug(e.nom)}${k==="presentation"?"":"/"+k}"${k===tab?' aria-current="page"':""}>${l}${nb[k]?`<small>${nb[k]}</small>`:""}</a>`).join("")}</nav>
  <div class="prose">${panneaux[tab]()}</div></div></div>
  <aside class="infobox">${portrait(e,i)}<div class="ib-head"><span>Espèce</span><strong>${esc(e.nom)}</strong></div><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></aside></div>
  <div class="refs"><a class="chip" href="#/${slug(p.nom)}"><small>Précédente</small>${esc(p.nom)}</a><a class="chip" href="#/${slug(n.nom)}"><small>Suivante</small>${esc(n.nom)}</a></div>`;
  if(tab==="dons")initFiltres();
}
function detail(i,k,j){
  const e=ESPECES[i],L=liste(e,k),x=L[j],p=L[(j+L.length-1)%L.length],n=L[(j+1)%L.length];
  const label=k==="don"?"Don d’ascendance":"Héritage",u=y=>`#/${slug(e.nom)}/${k}/${slug(y.titre)}`;
  document.title=x.titre+" – "+e.nom+" – "+TITRE;
  view.className="page";
  view.innerHTML=`<div class="crumbs"><a href="#/">Accueil</a><span>›</span><a href="#/${slug(e.nom)}">${esc(e.nom)}</a><span>›</span><span>${esc(x.titre)}</span></div>
  <div class="ph"><p class="eyebrow">${label} · ${esc(e.nom)}</p><h1>${esc(x.titre)}</h1>${(tg=>tg.length?`<div class="tags">${tg.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:"")([...(k==="don"?["Niveau "+x.niveau]:[]),...(x.action?[x.action]:[]),...(x.traits||[]),...(x.legacy?["Legacy Content"]:[])])}</div>
  <div class="prose">${x.prereq?`<p><strong>Prerequisites</strong> ${esc(x.prereq)}</p>`:""}${(x.meta||[]).map(([a,b])=>`<p><strong>${esc(a)}</strong> ${esc(b)}</p>`).join("")}${[].concat(x.texte).map(t=>`<p>${esc(t)}</p>`).join("")}${x.source?`<p><em>Source: ${esc(x.source)}</em></p>`:""}</div>
  <div class="refs"><a class="chip" href="#/${slug(e.nom)}/${k==="don"?"dons":"heritages"}"><small>Retour</small>${k==="don"?"Dons":"Héritages"} · ${esc(e.nom)}</a>${L.length>1?`<a class="chip" href="${u(p)}"><small>Précédent</small>${esc(p.titre)}</a><a class="chip" href="${u(n)}"><small>Suivant</small>${esc(n.titre)}</a>`:""}</div>`;
}
function route(){
  const q=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  const i=ESPECES.findIndex(e=>slug(e.nom)===q[0]);
  const j=i>=0?liste(ESPECES[i],q[1]).findIndex(x=>slug(x.titre)===q[2]):-1;
  j>=0?detail(i,q[1],j):i>=0?fiche(i,["heritages","dons"].includes(q[1])?q[1]:"presentation"):accueil();
  scrollTo(0,0);
}
view.addEventListener("click",e=>{const r=e.target.closest(".d-row");if(!r||e.target.closest("a"))return;const a=r.querySelector("a");if(a)a.click()});
addEventListener("hashchange",route);
route();

/* Ciel étoilé */
(()=>{
  const c=document.getElementById("sky"),x=c.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,stars=[],shots=[],last=0,next=0;
  function build(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(W*H/7500)},()=>{const b=Math.random()<.06;return{x:Math.random()*W,y:Math.random()*H,r:b?1.5+Math.random()*.8:.35+Math.random()*.75,a:.3+Math.random()*.6,ph:Math.random()*6.28,sp:.5+Math.random()*1.5,b}});
    draw(0,0);
  }
  function draw(t,dt){
    x.clearRect(0,0,W,H);
    const g=x.createRadialGradient(W*.55,H*.32,0,W*.55,H*.32,Math.max(W,H)*.65);
    g.addColorStop(0,"rgba(72,52,130,.17)");g.addColorStop(.5,"rgba(24,40,90,.07)");g.addColorStop(1,"rgba(5,8,19,0)");
    x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,W,H);
    for(const s of stars){const tw=RM?1:.62+.38*Math.sin(t/1000*s.sp+s.ph);x.globalAlpha=Math.min(1,s.a*tw);x.fillStyle=s.b?"#fff":"#d9e6ff";x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill()}
    x.globalAlpha=1;
    for(let k=shots.length-1;k>=0;k--){
      const o=shots[k];o.age+=dt;if(o.age>o.life){shots.splice(k,1);continue}
      const hx=o.x+o.vx*o.age,hy=o.y+o.vy*o.age,sp=Math.hypot(o.vx,o.vy),tx=hx-o.vx/sp*o.len,ty=hy-o.vy/sp*o.len;
      const lg=x.createLinearGradient(tx,ty,hx,hy);lg.addColorStop(0,"rgba(255,255,255,0)");lg.addColorStop(1,"#fff");
      x.globalAlpha=Math.sin(Math.PI*o.age/o.life);x.strokeStyle=lg;x.lineWidth=1.5;x.beginPath();x.moveTo(tx,ty);x.lineTo(hx,hy);x.stroke();
    }
    x.globalAlpha=1;
  }
  function loop(t){
    const dt=Math.min(.05,(t-last)/1000||0);last=t;
    if(t>next){const a=(28+Math.random()*14)*Math.PI/180,sp=650+Math.random()*350;shots.push({x:Math.random()*W*.8,y:Math.random()*H*.45,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:.8+Math.random()*.6,len:110+Math.random()*90});next=t+3500+Math.random()*5500}
    draw(t,dt);requestAnimationFrame(loop);
  }
  build();
  if(!RM)requestAnimationFrame(t=>{last=t;next=t+1500;loop(t)});
  let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-W)>40||innerHeight-H>150)build()},200)});
})();
</script>
