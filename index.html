<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espèces jouables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#050813;--panel:#0c1424;--panel-2:#101b30;--line:#1b2943;--text:#e9eef7;--muted:#8c98ae;--accent:#86cdf5;
--accent-soft:color-mix(in srgb,var(--accent) 14%,var(--bg));--accent-line:color-mix(in srgb,var(--accent) 38%,var(--bg));
--f-display:'Cinzel Decorative','Cinzel',Georgia,serif;--f-head:'Cinzel',Georgia,serif;--f-prose:'Cormorant Garamond',Georgia,serif;--f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:1080px;margin:0 auto;min-height:100vh;padding:40px max(20px,env(safe-area-inset-right,0px)) 96px max(20px,env(safe-area-inset-left,0px))}
.page.wide{max-width:none;padding-inline:clamp(20px,4vw,64px)}
.tagline{margin:0;font-family:var(--f-prose);font-size:1.25rem;line-height:1.4;color:#a3aec3}
/* Accueil */
.pagehead{display:grid;justify-items:center;gap:8px;text-align:center;margin-bottom:40px}
.pagehead h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.5rem);line-height:1.1;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 0 24px rgba(160,200,255,.4);text-wrap:balance}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.card{flex:1 1 260px;max-width:320px;min-width:0;display:flex;flex-direction:column;text-align:center;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.card-img{width:100%;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 38% 26%),hsl(var(--h) 40% 10%))}
.card-img span{font-family:var(--f-display);font-size:4rem;color:rgba(255,255,255,.5)}
.card-img img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .card-img img{transform:scale(1.04)}
.card-body{display:grid;gap:6px;padding:16px 18px 20px}
.card h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:1.08rem;letter-spacing:.03em;color:#f1f5fc}
.card p{margin:0;font-family:var(--f-prose);font-size:1.12rem;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Fiche */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:22px;font-size:13px;color:var(--muted)}
.crumbs a{color:var(--accent);text-decoration:none}.crumbs a:hover{text-decoration:underline}
.col{min-width:0}
.ph{margin-bottom:28px}
.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ph h1{margin:0;font-family:var(--f-head);font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.03em;line-height:1.15;overflow-wrap:anywhere}
.lede{margin:10px 0 0;font-family:var(--f-prose);font-style:italic;font-size:1.3rem;color:#a3aec3}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{padding:3px 10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-radius:4px}
.entry-grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,400px);gap:clamp(24px,4vw,56px);align-items:start}
.prose{min-width:0;font-family:var(--f-prose);font-size:1.3rem;line-height:1.7;color:#d6deec}
.prose p{margin:0 0 1em}
.prose h3{margin:1.8em 0 .5em;font-family:var(--f-head);font-weight:600;font-size:1.02rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.prose h3:first-child{margin-top:0}
.lvl{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font:600 11px/1.6 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);vertical-align:2px}
.infobox{position:sticky;top:24px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel) 90%,transparent)}
.ib-head{display:grid;gap:2px;padding:14px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ib-head span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ib-head strong{font-family:var(--f-head);font-size:1.1rem;font-weight:600;letter-spacing:.03em}
.infobox dl{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:10px 14px;margin:0;padding:16px}
.infobox dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.infobox dd{margin:0;font-family:var(--f-prose);font-size:1.1rem;line-height:1.35}
.refs{margin-top:48px;display:flex;flex-wrap:wrap;gap:12px}
.chip{display:inline-flex;flex-direction:column;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 86%,transparent);text-decoration:none;font-weight:500}
.chip:hover{border-color:var(--accent-line)}
.chip small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
@media (max-width:900px){.entry-grid{grid-template-columns:minmax(0,1fr);gap:24px}.col{display:contents}.infobox{position:static;order:1}.prose{order:2}.page{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="page" id="view"></main>

<script>
/* ===== MODIFIE ICI : une entrée par espèce =====
   nom, image (chemin ou lien, ex. "images/elfe.jpg"), accroche, resume (texte de la carte),
   description (paragraphes), tags (traits PF2e), pv, taille, vitesse, bonus, defauts, vision,
   langues, languesSup, infos (lignes supplémentaires [libellé, valeur]),
   capacites / heritages (titre + texte), dons (niveau + titre + texte).
   Un champ laissé vide n’est pas affiché. */
const TITRE="Müsinant";
const INTRO="Les espèces communes de Müsinant";
const ESPECES=[
  {
    nom:"Elvèn",
    image:"images/Elvén Portrait.png",
    accroche:"",
    resume:"Gracieux et longévifs, les elfes…",
    description:["Les elvéns, fiers descendants des elfes, forment un peuple versatile et adaptable qui s'est rapidement éparpillé à travers le globe. Leurs oreilles pointues leur permettent de mieux percevoir les bruits et leur héritage elfique leur a permis de développer des capacités similaires à celles de leurs ancêtres.","Dépossédés de l’immortalité par les dieux, les Elvéns doivent passer leur vie à racheter les péchés de leurs ancêtres."],
    tags:["Elvén","Humanoïde"],
    pv:"8",
    taille:"M",
    vitesse:"25 pieds",
    bonus:"2 free ability boosts",
    defauts:"",
    vision:"Low-light vision",
    langues:"Commun",
    languesSup:" Modificateur d’Intelligence",
    heritages:[{titre:"Arctic Elvén",texte:"You dwell deep in the frozen north and have gained incredible resilience against cold environments, granting you cold resistance equal to half your level (minimum 1). You treat environmental cold effects as if they were one step less extreme (incredible cold becomes extreme, extreme cold becomes severe, and so on)."}, {titre:"Chameleon Elvén",texte:"The color of your hair and skin is mutable. You can slowly change the vibrancy and the exact color, and the coloration can be different across your body, allowing you to create patterns or other colorful designs. It takes a single action for minor localized shifts and up to an hour for dramatic shifts throughout your body. While you're asleep, the colors shift on their own in tune with your dreams, giving you an unusual coloration each morning. When you're in an area where your coloration is roughly similar to the environment (for instance, forest green in a forest), you can use the single action to make minor localized shifts designed to help you blend into your surroundings. This grants you a +2 circumstance bonus to Stealth checks until your surroundings shift in coloration or pattern."}, {titre:"Costal Elvén",texte:"You come from an elvén family adapted to coastal shores, or inland ponds and lakes. You gain a +2 circumstance bonus to Athletics checks to Swim. If you critically fail an Athletics check to Swim, you get a failure instead."}, {titre:"Desert Elvén",texte:"You live under the desert's blazing heat, gaining incredible resilience to warm environments. You gain fire resistance equal to half your level (minimum 1), and environmental heat effects are one step less extreme for you (incredible heat becomes extreme, extreme heat becomes severe, and so on)."}, {titre:"Fey-Touched Elvén",texte:"The blood of the fey flows through your veins, saturating you with their magic and making you truly one of them. You gain the fey trait, in addition to the elvén and humanoid traits. Choose one cantrip from the primal spell list. You can cast this spell as a primal innate spell at will. A cantrip is heightened to a spell rank equal to half your level rounded up. You can change this cantrip to a different one from the same list once per day by meditating to realign yourself with your fey heritage; this is a 10-minute activity that has the concentrate trait."}, {titre:"Versatile Elvén",texte:"Elvén's versatility and ambition have fueled its ascendance to be the most common ancestry in most nations throughout the world. Select a general feat of your choice for which you meet the prerequisites (as with your ancestry feat, you can select this general feat at any point during character creation)."}, {titre:"Whisper Elvén",texte:"Your ears are finely tuned, able to detect even the slightest whispers of sound. You gain a +2 circumstance bonus when using the Seek action to find Hidden or Undetected creatures within 30 feet of you. When you target an opponent that is Concealed from you or hidden from you, reduce the DC of the flat check to 3 for a concealed target or 9 for a hidden one. This benefit doesn't apply if you can't hear or if the creature is incapable of making sound (for example, if it's affected by a Silence spell)."}, {titre:"Woodlan Elvén",texte:"You're adapted to life in the forest, the deep jungle, or a similar environment, and you know how to climb trees and use foliage to your advantage. When Climbing trees, vines, and other foliage, you move at half your Speed on a success and at full Speed on a critical success (and you move at full Speed on a success if you have Quick Climb). This doesn't affect you if you're using a climb Speed. You can always use the Take Cover action when you are within forest terrain to gain cover, even if you're not next to an obstacle you can Take Cover behind."}],
    dons:[{niveau:1,titre:"Adapted Cantrip",texte:"Through study of multiple magical traditions, you've altered a spell to suit your spellcasting style. Choose one cantrip from a magical tradition other than your own. If you prepare spells, you can choose this spell when you prepare your cantrips, in addition to your other options. If you have a spell repertoire, replace one of your cantrips known with the chosen spell. You can cast this cantrip as a spell of your class's tradition. If you swap or retrain this cantrip later, you can choose its replacement from the same alternate tradition or a different one."}, {niveau:1,titre:"Cooperative Nature",texte:"The short elvén life span lends perspective and has taught you from a young age to set aside differences and work with others to achieve greatness. You gain a +4 circumstance bonus on checks to Aid."}, {niveau:1,titre:"Elvén Lore",texte:"You've studied traditional elven arts, learning about arcane magic and the world around you. You gain the trained proficiency rank in Arcana and Nature. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice. You also gain the Additional Lore general feat for Elvén Lore."}, {niveau:1,titre:"Elvén Weapon Familiarity",texte:"You favor bows and other elegant weapons. You gain access to all uncommon weapons with the elf trait. You have familiarity with weapons with the elf trait plus Longbows, Composite Longbows, Rapiers, Shortbows, and Composite Shortbows—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons. At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect."}, {niveau:1,titre:"Friend of the Sea",texte:"You have established a companionship with a sea creature, often carrying them in a small, water-filled globe when you are on land. You gain the Pet general feat. Your pet must be aquatic, and it gains the darkvision and tough abilities in addition to the two abilities you normally choose for a pet."}, {niveau:1,titre:"General Training",texte:"Your adaptability manifests in your mastery of a range of useful abilities. You gain a 1st-level general feat. You must meet the feat's prerequisites, but if you select this feat during character creation, you can select the feat later in the process in order to determine which prerequisites you meet."}, {niveau:1,titre:"Haughty Obstinacy",texte:"Your powerful ego makes it harder for others to order you around. If you roll a success on a saving throw against a mental effect that attempts to directly control your actions, you critically succeed instead. If a creature rolls a failure on a check to Coerce you using Intimidation, it gets a critical failure instead (so it can't try to Coerce you again for 1 week)."}, {niveau:1,titre:"Natural Ambition",texte:"You were raised to be ambitious and always reach for the stars, leading you to progress quickly in your chosen field. You gain a 1st-level class feat for your class. You must meet the prerequisites, but you can select the feat later in the character creation process in order to determine which prerequisites you meet."}, {niveau:1,titre:"Natural Skill",texte:"Your ingenuity allows you to learn a wide variety of skills. You gain the trained proficiency rank in two skills of your choice."}, {niveau:1,titre:"Nimble Elvén",texte:"Your muscles are tightly honed. Your Speed increases by 5 feet."}, {niveau:1,titre:"Woodcraft",texte:"You have a innate familiarity with forested areas. When in a forest or jungle environment, if you roll a critical failure on a Survival skill check to Sense Direction, Subsist, or Cover Tracks, you get a failure instead, and if you roll a success, you get a critical success instead."}]
  },
  {
    nom:"Elfe",
    image:"images/Elvèn Portrait.png",
    accroche:"Peuple ancien des forêts",
    resume:"Gracieux et longévifs, les elfes…",
    description:["Premier paragraphe.","Deuxième paragraphe."],
    tags:["Elfe","Humanoïde"],
    pv:"6",
    taille:"M",
    vitesse:"9 m",
    bonus:"Dextérité, Intelligence, Libre",
    defauts:"Constitution",
    vision:"Vision nocturne",
    langues:"Commun, Elfique",
    languesSup:"Selon l’Intelligence",
    capacites:[{titre:"Nom de la capacité",texte:"Description."}],
    heritages:[{titre:"Héritage A",texte:"Description."}],
    dons:[{niveau:1,titre:"Nom du don",texte:"Description."}]
  },  
  {
    nom:"Elfe",
    image:"images/elfe.jpg",
    accroche:"Peuple ancien des forêts",
    resume:"Gracieux et longévifs, les elfes…",
    description:["Premier paragraphe.","Deuxième paragraphe."],
    tags:["Elfe","Humanoïde"],
    pv:"6",
    taille:"M",
    vitesse:"9 m",
    bonus:"Dextérité, Intelligence, Libre",
    defauts:"Constitution",
    vision:"Vision nocturne",
    langues:"Commun, Elfique",
    languesSup:"Selon l’Intelligence",
    capacites:[{titre:"Nom de la capacité",texte:"Description."}],
    heritages:[{titre:"Héritage A",texte:"Description."}],
    dons:[{niveau:1,titre:"Nom du don",texte:"Description."}]
  },
  {
    nom:"Elfe",
    image:"images/elfe.jpg",
    accroche:"Peuple ancien des forêts",
    resume:"Gracieux et longévifs, les elfes…",
    description:["Premier paragraphe.","Deuxième paragraphe."],
    tags:["Elfe","Humanoïde"],
    pv:"6",
    taille:"M",
    vitesse:"9 m",
    bonus:"Dextérité, Intelligence, Libre",
    defauts:"Constitution",
    vision:"Vision nocturne",
    langues:"Commun, Elfique",
    languesSup:"Selon l’Intelligence",
    capacites:[{titre:"Nom de la capacité",texte:"Description."}],
    heritages:[{titre:"Héritage A",texte:"Description."}],
    dons:[{niveau:1,titre:"Nom du don",texte:"Description."}]
  },
];
/* ===== FIN DE LA ZONE À MODIFIER ===== */

const view=document.getElementById("view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=n=>n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hue=i=>(i*40+200)%360;
const portrait=(e,i)=>`<div class="card-img" style="--h:${hue(i)}">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.nom)}" loading="lazy">`:`<span>${i+1}</span>`}</div>`;
const section=(t,a)=>a&&a.length?`<h3>${t}</h3>`+a.map(x=>`<p><strong>${esc(x.titre)}.</strong> ${esc(x.texte)}</p>`).join(""):"";
const feats=a=>a&&a.length?`<h3>Dons d’ascendance</h3>`+[...a].sort((x,y)=>x.niveau-y.niveau).map(x=>`<p><span class="lvl">Niv. ${esc(x.niveau)}</span><strong>${esc(x.titre)}.</strong> ${esc(x.texte)}</p>`).join(""):"";
const STATS=[["pv","Points de vie"],["taille","Taille"],["vitesse","Vitesse"],["bonus","Bonus de carac."],["defauts","Défaut de carac."],["vision","Vision"],["langues","Langues"],["languesSup","Langues suppl."]];

function accueil(){
  document.title=TITRE;
  view.className="page";
  view.innerHTML=`<header class="pagehead"><h1>${esc(TITRE)}</h1><p class="tagline">${esc(INTRO)}</p></header>
  <div class="grid">${ESPECES.map((e,i)=>`<a class="card" href="#/${slug(e.nom)}">${portrait(e,i)}<div class="card-body"><h3>${esc(e.nom)}</h3><p>${esc(e.resume)}</p></div></a>`).join("")}</div>`;
}
function fiche(i){
  const e=ESPECES[i],p=ESPECES[(i+ESPECES.length-1)%ESPECES.length],n=ESPECES[(i+1)%ESPECES.length];
  const rows=[...STATS.map(([k,l])=>[l,e[k]]),...(e.infos||[])].filter(([,v])=>v);
  document.title=e.nom+" – "+TITRE;
  view.className="page wide";
  view.innerHTML=`<div class="crumbs"><a href="#/">Accueil</a><span>›</span><span>${esc(e.nom)}</span></div>
  <div class="entry-grid"><div class="col"><div class="ph"><p class="eyebrow">Espèce</p><h1>${esc(e.nom)}</h1><p class="lede">${esc(e.accroche)}</p><div class="tags">${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
  <div class="prose">${e.description.map(t=>`<p>${esc(t)}</p>`).join("")}${section("Capacités spéciales",e.capacites)}${section("Héritages",e.heritages)}${feats(e.dons)}</div></div>
  <aside class="infobox">${portrait(e,i)}<div class="ib-head"><span>Espèce</span><strong>${esc(e.nom)}</strong></div><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></aside></div>
  <div class="refs"><a class="chip" href="#/${slug(p.nom)}"><small>Précédente</small>${esc(p.nom)}</a><a class="chip" href="#/${slug(n.nom)}"><small>Suivante</small>${esc(n.nom)}</a></div>`;
}
function route(){
  const s=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  const i=ESPECES.findIndex(e=>slug(e.nom)===s);
  i>=0?fiche(i):accueil();
  scrollTo(0,0);
}
addEventListener("hashchange",route);
route();

/* Ciel étoilé */
(()=>{
  const c=document.getElementById("sky"),x=c.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,stars=[],shots=[],last=0,next=0;
  function build(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(W*H/7500)},()=>{const b=Math.random()<.06;return{x:Math.random()*W,y:Math.random()*H,r:b?1.5+Math.random()*.8:.35+Math.random()*.75,a:.3+Math.random()*.6,ph:Math.random()*6.28,sp:.5+Math.random()*1.5,b}});
    draw(0,0);
  }
  function draw(t,dt){
    x.clearRect(0,0,W,H);
    const g=x.createRadialGradient(W*.55,H*.32,0,W*.55,H*.32,Math.max(W,H)*.65);
    g.addColorStop(0,"rgba(72,52,130,.17)");g.addColorStop(.5,"rgba(24,40,90,.07)");g.addColorStop(1,"rgba(5,8,19,0)");
    x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,W,H);
    for(const s of stars){const tw=RM?1:.62+.38*Math.sin(t/1000*s.sp+s.ph);x.globalAlpha=Math.min(1,s.a*tw);x.fillStyle=s.b?"#fff":"#d9e6ff";x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill()}
    x.globalAlpha=1;
    for(let k=shots.length-1;k>=0;k--){
      const o=shots[k];o.age+=dt;if(o.age>o.life){shots.splice(k,1);continue}
      const hx=o.x+o.vx*o.age,hy=o.y+o.vy*o.age,sp=Math.hypot(o.vx,o.vy),tx=hx-o.vx/sp*o.len,ty=hy-o.vy/sp*o.len;
      const lg=x.createLinearGradient(tx,ty,hx,hy);lg.addColorStop(0,"rgba(255,255,255,0)");lg.addColorStop(1,"#fff");
      x.globalAlpha=Math.sin(Math.PI*o.age/o.life);x.strokeStyle=lg;x.lineWidth=1.5;x.beginPath();x.moveTo(tx,ty);x.lineTo(hx,hy);x.stroke();
    }
    x.globalAlpha=1;
  }
  function loop(t){
    const dt=Math.min(.05,(t-last)/1000||0);last=t;
    if(t>next){const a=(28+Math.random()*14)*Math.PI/180,sp=650+Math.random()*350;shots.push({x:Math.random()*W*.8,y:Math.random()*H*.45,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:.8+Math.random()*.6,len:110+Math.random()*90});next=t+3500+Math.random()*5500}
    draw(t,dt);requestAnimationFrame(loop);
  }
  build();
  if(!RM)requestAnimationFrame(t=>{last=t;next=t+1500;loop(t)});
  let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-W)>40||innerHeight-H>150)build()},200)});
})();
</script>
</body>
</html>
